<title>تذكير الدواء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: phone app with 20 numbered screens. Header with back + screen number, scrolling content, bottom tab bar on main screens, bottom sheet-free flows. */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --ink:#10262B; --muted:#5A6F74; --line:#D6E1E3;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-bg:#DDF0F2;
  --ok:#1F8A55; --ok-bg:#E1F3E9; --bad:#B8362F; --bad-bg:#FBE6E4; --warn:#9A6A12; --warn-bg:#FAF0D9;
  --font-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  direction:rtl;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1416; --surface:#122024; --ink:#E4EEF0; --muted:#8FA6AB; --line:#24383D;
    --accent:#4FC3CC; --accent-ink:#06282B; --accent-bg:#12343A;
    --ok:#5CCB8F; --ok-bg:#12301F; --bad:#F08A82; --bad-bg:#3A1816; --warn:#E0B25A; --warn-bg:#352B12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1416; --surface:#122024; --ink:#E4EEF0; --muted:#8FA6AB; --line:#24383D;
  --accent:#4FC3CC; --accent-ink:#06282B; --accent-bg:#12343A;
  --ok:#5CCB8F; --ok-bg:#12301F; --bad:#F08A82; --bad-bg:#3A1816; --warn:#E0B25A; --warn-bg:#352B12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:8px 120px;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.app.big{zoom:1.14}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}

/* screen header */
.ph{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding-top:6px;min-height:52px}
.ph h1{font-size:21px;font-weight:600}
.pgno{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-family:var(--font-display)}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;padding:0}
.icon svg{width:22px;height:22px}
.badge{position:absolute;top:-4px;inset-inline-start:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:12px;display:grid;place-items:center;padding:0 5px;font-family:var(--font-display)}

/* home top */
.top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding-top:6px}
.date{color:var(--muted);font-size:14px}
.greet{font-size:26px;font-weight:600}
.next{margin-top:6px;font-size:15px}
.next b{font-weight:600;color:var(--accent)}
.ring{position:relative;width:88px;height:88px}
.ring svg{width:88px;height:88px;display:block}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--font-display);line-height:1.1}
.ring .c strong{font-size:20px;font-weight:600}
.ring .c span{font-size:11px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.2}
.tile span{font-size:12px;color:var(--muted);line-height:1.3}

/* dose card */
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.dose{display:grid;grid-template-columns:78px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.dose.due{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.dose .t{border-inline-end:1px dashed var(--line);padding-inline-end:12px;font-family:var(--font-display);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;white-space:nowrap}
.dose .t b{font-size:21px;font-weight:600;line-height:1.1}
.dose .t small{font-size:12px;color:var(--muted)}
.dose .b{min-width:0;display:flex;flex-direction:column;gap:8px}
.nm{font-family:var(--font-display);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.lnk{background:none;border:0;padding:0;text-align:start;font:inherit;font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500;background:var(--bg);color:var(--muted)}
.chip.taken,.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.due{background:var(--accent-bg);color:var(--accent)}
.chip.missed,.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ex,.chip.warn{background:var(--warn-bg);color:var(--warn)}

/* buttons */
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.block{width:100%;min-height:52px;font-size:17px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger[data-armed="1"]{background:var(--bad);color:var(--surface)}
.btn.ghost{background:transparent}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:16px}
.panel p{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px}
.empty{text-align:center;padding:26px 12px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.sec{font-family:var(--font-display);font-size:14px;color:var(--muted);margin:6px 2px -4px}
.prog{height:10px;border-radius:999px;background:var(--bg);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.prog i.bad{background:var(--bad)}
.prog i.warn{background:var(--warn)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:14px;font-weight:500;color:var(--muted)}
input[type=text],input[type=time],input[type=date],input[type=search],select,textarea{height:48px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:0 12px;font:inherit;font-size:16px;width:100%;min-width:0}
textarea{height:auto;min-height:110px;padding:10px 12px;line-height:1.7;resize:vertical}
.ltr{direction:ltr;text-align:right}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px}
.err{color:var(--bad);font-size:14px;min-height:1.3em}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--accent)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw button{width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--bg);position:relative;padding:0;flex:none}
.sw button::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:inset-inline-start .15s}
.sw button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.sw button[aria-pressed="true"]::after{inset-inline-start:25px;background:var(--accent-ink)}

/* welcome / onboarding */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:36px 8px 8px}
.hero svg{width:150px;height:150px}
.hero h1{font-size:32px}
.hero p{color:var(--muted);max-width:30ch}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:26px;border-radius:999px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1/1;border-radius:10px;border:1px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:15px;min-width:0}
.cal button.sel{border-color:var(--accent);background:var(--accent-bg)}
.cal button.today b{color:var(--accent)}
.cal .blank{background:transparent}
.cal .dt{width:7px;height:7px;border-radius:50%;background:transparent}
.cal .dt.ok{background:var(--ok)}.cal .dt.part{background:var(--warn)}.cal .dt.bad{background:var(--bad)}.cal .dt.up{background:var(--muted)}

/* bars */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bar .track{width:100%;max-width:34px;height:96px;background:var(--bg);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.bar .fill{width:100%;border-radius:8px 8px 0 0;background:var(--accent)}
.bar .fill.partial{background:var(--warn)}
.bar .fill.zero{background:var(--bad)}
.bar small{font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.big{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1}

/* alert */
.alertcard{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.alertcard svg{width:96px;height:96px}
.alertcard .tm{font-family:var(--font-display);font-size:34px;font-weight:600}
.alertcard .acts{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px}

/* medical id */
.mid{border:2px solid var(--bad);border-radius:16px;overflow:hidden;background:var(--surface)}
.mid header{background:var(--bad);color:var(--surface);padding:10px 14px;font-family:var(--font-display);font-weight:600;display:flex;justify-content:space-between}
.mid dl{margin:0;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.mid dt{color:var(--muted);font-size:14px}
.mid dd{margin:0;overflow-wrap:anywhere}

/* hub list */
.menu{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.menu button{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.menu .n{width:34px;height:34px;border-radius:10px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:14px}
.menu b{font-weight:600;display:block;font-family:var(--font-display);font-size:15px}
.menu small{color:var(--muted);font-size:13px;line-height:1.3;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:start;min-height:64px;display:flex;gap:8px;align-items:center;min-width:0}
.grid2 .n{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-family:var(--font-display);font-weight:600}
.grid2 span.t{font-size:14px;line-height:1.3;font-weight:500}

/* nav */
.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{background:none;border:0;min-height:52px;border-radius:10px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;height:54px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab svg{width:20px;height:20px}
.toast{position:fixed;inset-inline:16px;top:calc(8px + env(safe-area-inset-top,0px));max-width:488px;margin-inline:auto;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 16px;z-index:20;font-weight:500;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;min-height:36px;padding:0 12px;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
.tbl th{color:var(--muted);font-weight:500}
.scroll-x{overflow-x:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<button class="fab" id="fab" type="button" data-act="new-med" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  إضافة دواء
</button>
<nav class="tabs" id="tabs" aria-label="التنقل" hidden></nav>

<script>
(function(){
'use strict';
var KEY='adwiya.v1';
var DAY_CHIPS=[[6,'السبت'],[0,'الأحد'],[1,'الاثنين'],[2,'الثلاثاء'],[3,'الأربعاء'],[4,'الخميس'],[5,'الجمعة']];
var WEEK_HEAD=['س','ح','ن','ث','ر','خ','ج'];
var nf=new Intl.NumberFormat('ar-EG');
var tf=new Intl.DateTimeFormat('ar-EG',{hour:'numeric',minute:'2-digit',hour12:true});
var dfLong=new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long'});
var dfShort=new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'long'});
var dfMonth=new Intl.DateTimeFormat('ar-EG',{month:'long',year:'numeric'});
var dfWd=new Intl.DateTimeFormat('ar-EG',{weekday:'short'});
document.documentElement.lang='ar';
document.documentElement.dir='rtl';

function pad(n){return n<10?'0'+n:''+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(n){return nf.format(n);}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36);}

/* ---------- state ---------- */
function seed(){
  var today=new Date(), k=dateKey(today);
  return {v:2,onboarded:false,
    profile:{name:'',age:'',gender:'',conditions:[],allergies:'',blood:'',emName:'',emPhone:''},
    settings:{sound:true,snooze:10,dueWindow:90,theme:'system',big:false,refillDays:7},
    meds:[
      {id:'ex1',name:'ميتفورمين',dose:'٥٠٠ ملغ',form:'قرص',times:['08:00','20:00'],days:[0,1,2,3,4,5,6],note:'بعد الأكل',example:true,start:k,end:null,stock:9},
      {id:'ex2',name:'فيتامين د',dose:'١٠٠٠ وحدة',form:'كبسولة',times:['13:00'],days:[0,1,2,3,4,5,6],note:'مع الأكل',example:true,start:k,end:null,stock:40}
    ],
    log:{},notifs:[],
    caregivers:[{id:'cg1',name:'سارة',rel:'ابنة',phone:'01000000000',notify:true,example:true}],
    doctors:[{id:'d1',name:'د. أحمد سمير',spec:'باطنة وسكر',phone:'01100000000',example:true}],
    appts:[{id:'a1',doctor:'د. أحمد سمير',date:dateKey(addDays(today,3)),time:'11:00',note:'متابعة تحليل السكر',example:true}],
    symptoms:[{id:'s1',at:Date.now()-86400000,text:'غثيان خفيف بعد الجرعة',level:'خفيف',med:'ex1',example:true}]
  };
}
function fresh(){
  var s=seed();
  s.meds=[];s.caregivers=[];s.doctors=[];s.appts=[];s.symptoms=[];
  return s;
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var s=JSON.parse(r);
      if(s&&Array.isArray(s.meds)&&s.log){
        var base=seed(), out=Object.assign({},base,s);
        out.settings=Object.assign({},base.settings,s.settings||{});
        if(typeof s.sound==='boolean'&&!(s.settings&&typeof s.settings.sound==='boolean'))out.settings.sound=s.sound;
        out.profile=Object.assign({},base.profile,s.profile||{});
        if(s.onboarded===undefined)out.onboarded=true;
        ['notifs','caregivers','doctors','appts','symptoms'].forEach(function(k){if(!Array.isArray(out[k]))out[k]=[];});
        return out;
      }
    }
  }catch(e){}
  return seed();
}
var state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

/* ---------- schedule logic ---------- */
function dosesFor(date){
  var dow=date.getDay(), k=dateKey(date), out=[];
  state.meds.forEach(function(m){
    if(m.start&&m.start>k)return;
    if(m.end&&m.end<k)return;
    if(m.days.indexOf(dow)<0)return;
    m.times.forEach(function(t){out.push({med:m,time:t,key:m.id+'|'+t});});
  });
  out.sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:a.med.name.localeCompare(b.med.name,'ar');});
  return out;
}
function statusOf(dose,date,now){
  var rec=(state.log[dateKey(date)]||{})[dose.key];
  if(rec)return rec.s;
  var p=dose.time.split(':'), due=new Date(date);
  due.setHours(+p[0],+p[1],0,0);
  var diff=(now-due)/60000;
  if(diff<0)return 'upcoming';
  if(diff<=state.settings.dueWindow)return 'due';
  return 'missed';
}
function timeParts(t){
  var p=t.split(':'), d=new Date(2000,0,1,+p[0],+p[1]), hm='', per='';
  tf.formatToParts(d).forEach(function(x){
    if(x.type==='dayPeriod'){per=x.value;}
    else if(!(x.type==='literal'&&!x.value.trim())){hm+=x.value;}
  });
  return {hm:hm.trim(),per:per};
}
function fullTime(t){var p=timeParts(t);return p.hm+' '+p.per;}
function daysText(days){
  if(days.length===7)return 'كل يوم';
  return DAY_CHIPS.filter(function(c){return days.indexOf(c[0])>=0;}).map(function(c){return c[1];}).join('، ');
}
function relDay(k){
  var t=dateKey(new Date());
  if(k===t)return 'اليوم';
  if(k===dateKey(addDays(new Date(),1)))return 'غداً';
  return dfShort.format(fromKey(k));
}
function daysLeft(m){
  if(m.stock==null)return Infinity;
  var per=m.times.length*m.days.length/7;
  return per?m.stock/per:Infinity;
}
function adherence(nDays,medId){
  var now=new Date(), taken=0, elig=0, per=[], i;
  for(i=nDays-1;i>=0;i--){
    var d=addDays(now,-i), doses=dosesFor(d), t=0, e=0, tot=0;
    doses.forEach(function(x){
      if(medId&&x.med.id!==medId)return;
      tot++;
      var s=statusOf(x,d,now);
      if(s==='taken'){t++;e++;}
      else if(s==='skipped'||s==='missed'){e++;}
    });
    taken+=t; elig+=e;
    per.push({date:d,total:tot,taken:t});
  }
  return {taken:taken,elig:elig,per:per,rate:elig?Math.round(taken/elig*100):null};
}
function streak(){
  var now=new Date(), n=0, i;
  for(i=0;i<90;i++){
    var d=addDays(now,-i), doses=dosesFor(d);
    if(!doses.length)continue;
    var all=true, anyMissed=false;
    doses.forEach(function(x){
      var s=statusOf(x,d,now);
      if(s!=='taken')all=false;
      if(s==='missed'||s==='skipped')anyMissed=true;
    });
    if(all){n++;}
    else if(i===0&&!anyMissed){continue;}
    else break;
  }
  return n;
}
function setStatus(key,s){
  var k=dateKey(new Date());
  var day=state.log[k]=state.log[k]||{};
  var prev=day[key], id=key.split('|')[0];
  var med=state.meds.filter(function(m){return m.id===id;})[0];
  if(s){
    var rec={s:s,at:Date.now()};
    if(prev&&prev.dec){
      if(s==='taken'){rec.dec=true;}
      else if(med&&med.stock!=null){med.stock++;}
    }else if(s==='taken'&&med&&med.stock!=null&&med.stock>0){med.stock--;rec.dec=true;}
    day[key]=rec;
  }else{
    if(prev&&prev.dec&&med&&med.stock!=null)med.stock++;
    delete day[key];
  }
  delete snoozed[key];
  save(); render(true);
}

/* ---------- forms ---------- */
function blankAdd(){return {name:'',dose:'',form:'قرص',times:['08:00'],days:[0,1,2,3,4,5,6],note:'',duration:0,stock:''};}
var forms={
  ui:{q:'',period:7,showCg:false,showDoc:false,showAppt:false},
  profile:{name:'',age:'',gender:''},
  health:{conditions:[],other:'',allergies:'',blood:''},
  add:blankAdd(),
  cg:{name:'',rel:'',phone:'',notify:true},
  doc:{name:'',spec:'',phone:''},
  appt:{doctor:'',date:'',time:'10:00',note:''},
  sym:{text:'',level:'خفيف',med:''},
  err:{}
};
function rootOf(p){return p.indexOf('S.')===0?{o:state,path:p.slice(2),st:true}:{o:forms,path:p,st:false};}
function setPath(p,v){
  var r=rootOf(p), a=r.path.split('.'), o=r.o, i;
  for(i=0;i<a.length-1;i++)o=o[a[i]];
  o[a[a.length-1]]=v;
  if(r.st)save();
}
function getPath(p){
  var r=rootOf(p);
  return r.path.split('.').reduce(function(o,k){return o==null?o:o[k];},r.o);
}
function fid(p){return 'f-'+p.replace(/[^a-zA-Z0-9]/g,'-');}
function field(label,p,o){
  o=o||{};
  var v=getPath(p);
  return '<div class="field"><label for="'+fid(p)+'">'+label+'</label><input id="'+fid(p)+'" data-f="'+p+'" type="'+(o.type||'text')+'" value="'+esc(v)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.mode?' inputmode="'+o.mode+'"':'')+(o.ltr?' class="ltr"':'')+' autocomplete="off"></div>';
}
function chips(p,opts,multi,numeric){
  var cur=getPath(p);
  return '<div class="opts">'+opts.map(function(o){
    var val=Array.isArray(o)?o[0]:o, lab=Array.isArray(o)?o[1]:o;
    var on=multi?cur.indexOf(val)>=0:cur===val;
    return '<button class="opt" type="button" data-act="'+(multi?'toggle':'set')+'" data-f="'+p+'" data-v="'+esc(val)+'"'+(numeric?' data-n="1"':'')+' aria-pressed="'+(on?'true':'false')+'">'+esc(lab)+'</button>';
  }).join('')+'</div>';
}

var SCREENS={}, ORDER=[];
function def(id,n,title,nav,render){SCREENS[id]={id:id,n:n,title:title,nav:nav,render:render};ORDER.push(id);}
var cur='home', stack=[], selMed=null, obSlide=0, snoozed={}, notified={};
var cal={y:new Date().getFullYear(),m:new Date().getMonth(),sel:dateKey(new Date())};

function head(title,right){
  var n=SCREENS[cur].n;
  return '<header class="ph"><button class="icon" type="button" data-act="back" aria-label="رجوع">'+I.back+'</button><h1>'+title+'</h1>'+(n?'<span class="pgno num">'+num(n)+' / '+num(20)+'</span>':'<span></span>')+(right||'<span></span>')+'</header>';
}
function errLine(s){return '<div class="err" role="alert">'+esc(forms.err[s]||'')+'</div>';}
function emptyBox(text,btn){return '<div class="panel empty"><p>'+text+'</p>'+(btn||'')+'</div>';}
function medById(id){return state.meds.filter(function(m){return m.id===id;})[0];}
function unread(){return state.notifs.filter(function(n){return !n.read;}).length;}

function ringSvg(frac){
  var C=2*Math.PI*34, d=Math.max(0,Math.min(1,frac))*C;
  return '<svg viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="34" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="44" cy="44" r="34" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+d.toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 44 44)"/></svg>';
}
function chipFor(s){
  var m={taken:['taken','تم أخذها'],skipped:['','تم تخطيها'],due:['due','حان الوقت'],missed:['missed','فاتت'],upcoming:['','قادمة']}[s];
  return '<span class="chip '+m[0]+'">'+m[1]+'</span>';
}
function doseCard(d,s,interactive){
  var tp=timeParts(d.time), actions;
  if(!interactive){actions='<div class="row">'+chipFor(s)+'</div>';}
  else if(s==='taken'||s==='skipped'){
    actions='<div class="row">'+chipFor(s)+'<button class="btn sm ghost" type="button" data-act="undo" data-key="'+esc(d.key)+'">تراجع</button></div>';
  }else{
    actions='<div class="row">'+chipFor(s)+'<button class="btn sm primary" type="button" data-act="take" data-key="'+esc(d.key)+'">تم أخذها</button><button class="btn sm ghost" type="button" data-act="skip" data-key="'+esc(d.key)+'">تخطي</button></div>';
  }
  var meta=[d.med.dose,d.med.form,d.med.note].filter(Boolean).map(esc).join(' · ');
  return '<li class="dose'+(s==='due'?' due':'')+'"><div class="t"><b class="num">'+tp.hm+'</b><small>'+tp.per+'</small></div><div class="b"><div><button class="lnk" type="button" data-act="open-med" data-id="'+esc(d.med.id)+'">'+esc(d.med.name)+'</button>'+(meta?'<div class="meta">'+meta+'</div>':'')+'</div>'+actions+'</div></li>';
}

def('home',5,'الرئيسية',true,function(){
  var now=new Date(), doses=dosesFor(now), h=now.getHours(), taken=0, next=null;
  var greet=h<12?'صباح الخير':(h<18?'مساء الخير':'مساء النور');
  var items=doses.map(function(d){
    d.s=statusOf(d,now,now);
    if(d.s==='taken')taken++;
    if(!next&&(d.s==='due'||d.s==='upcoming'))next=d;
    return d;
  });
  var nl;
  if(!doses.length)nl='لا توجد جرعات مجدولة اليوم.';
  else if(next&&next.s==='due')nl='حان موعد <b>'+esc(next.med.name)+'</b> ('+fullTime(next.time)+')';
  else if(next)nl='الجرعة التالية: <b>'+esc(next.med.name)+'</b> الساعة '+fullTime(next.time);
  else nl='انتهت جرعات اليوم. أحسنت.';
  var low=state.meds.filter(function(m){return m.stock!=null&&daysLeft(m)<=state.settings.refillDays;}).length;
  var ap=state.appts.filter(function(a){return a.date>=dateKey(now);}).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;})[0];
  var nm=state.profile.name?' '+esc(state.profile.name):'';
  var html='<section class="top"><div><div class="date">'+dfLong.format(now)+'</div><h1 class="greet">'+greet+nm+'</h1><div class="next">'+nl+'</div></div>'+
    '<div class="ring">'+ringSvg(doses.length?taken/doses.length:0)+'<div class="c"><strong class="num">'+num(taken)+'/'+num(doses.length)+'</strong><span>جرعات</span></div></div></section>';
  html+='<div class="row sp"><span></span><button class="icon" type="button" data-act="goto" data-to="notifs" aria-label="الإشعارات">'+I.bell+(unread()?'<span class="badge num">'+num(unread())+'</span>':'')+'</button></div>';
  html+='<div class="tiles"><button class="tile" type="button" data-act="goto" data-to="history"><b class="num">'+num(streak())+'</b><span>أيام التزام متتالية</span></button>'+
    '<button class="tile" type="button" data-act="goto" data-to="refill"><b class="num">'+num(low)+'</b><span>أدوية قاربت على النفاد</span></button>'+
    '<button class="tile" type="button" data-act="goto" data-to="doctors"><b>'+(ap?relDay(ap.date):'—')+'</b><span>'+(ap?'موعد الطبيب':'لا مواعيد')+'</span></button></div>';
  if(state.meds.some(function(m){return m.example;}))html+='<div class="notice">الأدوية المكتوب عليها «مثال» للتوضيح فقط. احذفها من شاشة «أدويتي» وأضف أدويتك.</div>';
  if(!doses.length)html+=emptyBox('لا توجد جرعات اليوم. أضف دواءً لتبدأ التذكيرات.','<button class="btn primary" type="button" data-act="new-med">إضافة دواء</button>');
  else html+='<ul class="list">'+items.map(function(d){return doseCard(d,d.s,true);}).join('')+'</ul>';
  html+='<p class="muted small">التطبيق يذكّر بمواعيدك فقط ولا يغني عن استشارة الطبيب أو الصيدلي.</p>';
  return html;
});

def('alert',10,'تنبيه الدواء',true,function(){
  var now=new Date(), nowMs=Date.now(), due=[], next=null;
  dosesFor(now).forEach(function(d){
    var s=statusOf(d,now,now);
    if(s==='due'&&!(snoozed[d.key]&&snoozed[d.key]>nowMs))due.push(d);
    if(!next&&s==='upcoming')next=d;

    html+=emptyBox('لا يوجد دواء مستحق الآن. هكذا تبدو الشاشة عندما يحين موعد جرعة.');
    if(next){html+='<div class="sec">معاينة: الجرعة القادمة</div>'+alertCard(next,true);}
    return html;
  }
  return html+due.map(function(d){return alertCard(d,false);}).join('');
});

/* 11 calendar */
function dayState(date,now){
  var doses=dosesFor(date);
  if(!doses.length)return '';
  var t=0,bad=0;
  doses.forEach(function(x){var s=statusOf(x,date,now);if(s==='taken')t++;else if(s==='missed'||s==='skipped')bad++;});
  if(t===doses.length)return 'ok';
  if(dateKey(date)>dateKey(now))return 'up';
  if(t===0&&bad===0)return 'up';
  if(t===0)return 'bad';
  return 'part';
}
def('calendar',11,'التقويم',true,function(){
  var now=new Date(), first=new Date(cal.y,cal.m,1), lead=(first.getDay()+1)%7, dim=new Date(cal.y,cal.m+1,0).getDate(), cells='', i;
  for(i=0;i<lead;i++)cells+='<button class="blank" type="button" disabled aria-hidden="true"></button>';
  for(i=1;i<=dim;i++){
    var d=new Date(cal.y,cal.m,i), k=dateKey(d);
    cells+='<button type="button" data-act="cal-sel" data-k="'+k+'" class="'+(k===cal.sel?'sel ':'')+(k===dateKey(now)?'today':'')+'"><b class="num">'+num(i)+'</b><span class="dt '+dayState(d,now)+'"></span></button>';
  }
  var sd=fromKey(cal.sel), doses=dosesFor(sd), isToday=cal.sel===dateKey(now);

function reportText(n){
  var now=new Date(), ad=adherence(n), lines=[];
  lines.push('تقرير الالتزام الدوائي'+(state.profile.name?' — '+state.profile.name:''));
  lines.push('الفترة: آخر '+num(n)+' يوماً حتى '+dfShort.format(now));
  lines.push('الالتزام العام: '+(ad.rate==null?'لا بيانات':num(ad.rate)+'٪ ('+num(ad.taken)+' من '+num(ad.elig)+' جرعة)'));
  if(state.meds.length){lines.push('');lines.push('الأدوية:');}
  state.meds.forEach(function(m){var a=adherence(n,m.id);lines.push('- '+m.name+(m.dose?' '+m.dose:'')+': '+(a.rate==null?'لا بيانات':num(a.taken)+'/'+num(a.elig)+' ('+num(a.rate)+'٪)'));});
  var since=Date.now()-n*86400000, sy=state.symptoms.filter(function(s){return s.at>=since;});
  lines.push('');
  lines.push('الأعراض المسجلة: '+(sy.length?'':'لا يوجد'));
  sy.forEach(function(s){lines.push('- '+s.text+' ('+s.level+')');});
  return lines.join('\n');
}

var MORE=[['history','سجل الالتزام','نسبة الالتزام والأيام المتتالية'],['refill','المخزون والتجديد','متى تحتاج شراء الدواء'],['notifs','الإشعارات','تنبيهات الجرعات والمخزون'],['caregivers','المرافقون','شارك تقدمك مع من تثق به'],['doctors','الأطباء والمواعيد','مواعيدك وبيانات أطبائك'],['symptoms','الأعراض الجانبية','سجّل ما تشعر به'],['report','تقرير للطبيب','ملخص جاهز للنسخ'],['emergency','بطاقة الطوارئ','بياناتك الطبية السريعة'],['settings','الإعدادات','التنبيهات والمظهر والبيانات'],['index','فهرس الشاشات','كل الشاشات الـ٢٠']];
def('more',0,'المزيد',true,function(){
  return '<header class="ph"><span></span><h1>المزيد</h1><span></span><span></span></header><ul class="menu">'+MORE.map(function(m){
    var s=SCREENS[m[0]];
    return '<li><button type="button" data-act="goto" data-to="'+m[0]+'"><span class="n num">'+(s&&s.n?num(s.n):'☰')+'</span><span><b>'+m[1]+'</b><small>'+m[2]+'</small></span><span aria-hidden="true">‹</span></button></li>';
  }).join('')+'</ul>';
});
def('index',0,'فهرس الشاشات',true,function(){
  var list=ORDER.map(function(id){return SCREENS[id];}).filter(function(s){return s.n;}).sort(function(a,b){return a.n-b.n;});
  return head('فهرس الشاشات')+'<p class="muted small">اضغط أي شاشة لفتحها مباشرة.</p><div class="grid2">'+list.map(function(s){
    return '<button type="button" data-act="goto" data-to="'+s.id+'"><span class="n num">'+num(s.n)+'</span><span class="t">'+s.title+'</span></button>';
  }).join('')+'</div>';
});

/* ---------- router / render ---------- */
var appEl=document.getElementById('app'), tabsEl=document.getElementById('tabs'), fabEl=document.getElementById('fab'), toastEl=document.getElementById('toast');
var TAB_OF={home:'home',alert:'home',meds:'meds',medDetail:'meds',add1:'meds',add2:'meds',calendar:'cal'};
var TABS=[['home','الرئيسية',I.home,'home'],['meds','أدويتي',I.pill,'meds'],['cal','التقويم',I.cal,'calendar'],['more','المزيد',I.more,'more']];
var NO_NAV={welcome:1,onboard:1,profile:1,health:1};
var lastSig='';
function sigNow(){
  var now=new Date(), s=cur+'|'+dateKey(now)+'|'+unread()+'|'+state.meds.length;
  dosesFor(now).forEach(function(d){s+='|'+d.key+':'+statusOf(d,now,now);});
  Object.keys(snoozed).forEach(function(k){s+='|z'+k+(snoozed[k]>Date.now()?1:0);});
  return s;
}
function render(keepScroll){
  var y=window.scrollY;
  var sc=SCREENS[cur];
  appEl.innerHTML=sc.render();
  appEl.className='app'+(state.settings.big?' big':'');
  var nav=!NO_NAV[cur];
  tabsEl.hidden=!nav; fabEl.hidden=!(cur==='home'||cur==='meds');
  if(nav){
    var at=TAB_OF[cur]||'more';
    tabsEl.innerHTML=TABS.map(function(t){return '<button type="button" data-act="goto" data-to="'+t[3]+'"'+(t[0]===at?' aria-current="page"':'')+'>'+t[2]+t[1]+'</button>';}).join('');
  }
  lastSig=sigNow();
  window.scrollTo(0,keepScroll===true?y:0);
}
function go(id,o){
  o=o||{};
  if(!SCREENS[id])id='home';
  if(id==='medDetail'&&!medById(selMed)){id='meds';}
  if(cur!==id&&!o.noPush)stack.push(cur);
  cur=id;
  try{if(location.hash!=='#'+id)location.hash=id;}catch(e){}
  render(false);
}
function back(){
  var p=stack.pop();
  if(!p)p='home';
  cur=p;
  try{location.hash=p;}catch(e){}
  render(false);
}
window.addEventListener('hashchange',function(){
  var id=(location.hash||'').slice(1);
  if(SCREENS[id]&&id!==cur){go(id,{noPush:true});}
});
function applySettings(){
  var t=state.settings.theme, r=document.documentElement;
  if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
}

/* ---------- reminders ---------- */
var ac=null;
function unlock(){
  try{
    if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}
    if(ac&&ac.state==='suspended')ac.resume().catch(function(){});
  }catch(e){}
}
document.addEventListener('pointerdown',unlock);
function beep(){
  if(!state.settings.sound)return;
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
  if(!ac)return;
  try{
    [0,0.28,0.56].forEach(function(t){
      var o=ac.createOscillator(),g=ac.createGain();
      o.frequency.value=880;g.gain.value=0.15;
      o.connect(g);g.connect(ac.destination);
      o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.16);
    });
  }catch(e){}
}
var toastTimer=null;
function toast(msg,to){
  toastEl.innerHTML='<span>'+msg+'</span>'+(to?'<button type="button" data-act="goto" data-to="'+to+'">عرض</button>':'');
  toastEl.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.hidden=true;},10000);
}
function pushNotif(id,type,text){
  if(state.notifs.some(function(n){return n.id===id;}))return false;
  state.notifs.unshift({id:id,type:type,text:text,at:Date.now(),read:false});
  if(state.notifs.length>60)state.notifs.length=60;
  save();
  return true;
}
function sysNotify(title,body,tag){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    var opts={body:body,tag:tag,vibrate:[200,100,200],lang:'ar',dir:'rtl',renotify:true,data:{url:'./#alert'}};
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(function(r){r.showNotification(title,opts);});}
  }catch(e){}
}
function tick(){
  var now=new Date(), k=dateKey(now), fresh=[], again=[], ms=Date.now();
  Object.keys(snoozed).forEach(function(key){
    if(snoozed[key]<=ms){delete snoozed[key];delete notified[k+'|'+key];}
  });
  dosesFor(now).forEach(function(d){
    if(statusOf(d,now,now)==='due'&&!(snoozed[d.key]&&snoozed[d.key]>ms)){
      var id=k+'|'+d.key;
      if(!notified[id]){notified[id]=1;fresh.push(d);}
    }
  });
  if(fresh.length){
    var names=fresh.map(function(d){return esc(d.med.name)+' ('+fullTime(d.time)+')';}).join('، ');
    fresh.forEach(function(d){pushNotif('dose|'+k+'|'+d.key,'dose','حان موعد '+d.med.name+' ('+fullTime(d.time)+')');});
    toast('حان موعد الدواء: '+names,'alert');
    sysNotify('حان موعد الدواء',fresh.map(function(d){return d.med.name+' ('+fullTime(d.time)+')';}).join('، '),'dose-'+k+'-'+fresh[0].key);
    beep();
  }
  state.meds.forEach(function(m){
    if(m.stock!=null&&daysLeft(m)<=state.settings.refillDays){
      if(pushNotif('stock|'+m.id+'|'+k,'stock','مخزون '+m.name+' يكفي نحو '+num(Math.floor(daysLeft(m)))+' يوماً. جدّد قريباً.')){toast('مخزون '+esc(m.name)+' قارب على النفاد','refill');sysNotify('المخزون قليل',m.name+' قارب على النفاد','stock-'+m.id+'-'+k);}
    }
  });
  var tom=dateKey(addDays(now,1));
  state.appts.forEach(function(a){
    if(a.date===k||a.date===tom){
      if(pushNotif('appt|'+a.id+'|'+k,'appt','موعد '+(a.doctor||'الطبيب')+' '+(a.date===k?'اليوم':'غداً')+' الساعة '+fullTime(a.time))){toast('لديك موعد '+(a.date===k?'اليوم':'غداً'),'doctors');sysNotify('موعد طبيب',(a.doctor||'الطبيب')+' '+(a.date===k?'اليوم':'غداً')+' الساعة '+fullTime(a.time),'appt-'+a.id+'-'+k);}
    }
  });
  if(!NOFORM[cur]&&sigNow()!==lastSig)render(true);
}
var NOFORM={add1:1,add2:1,meds:1,profile:1,health:1,caregivers:1,doctors:1,symptoms:1,report:1,settings:1,emergency:1,more:1,index:1,welcome:1,onboard:1,notifs:1,refill:1};

function notifPanel(){
  var st=('Notification' in window)?Notification.permission:'none', body;
  if(st==='granted')body='<span class="chip ok" style="align-self:flex-start">إشعارات الجهاز مفعّلة</span>';
  else if(st==='denied')body='<p>الإشعارات محظورة. فعّلها من إعدادات المتصفح للموقع ثم أعد فتح التطبيق.</p>';
  else if(st==='none')body='<p>هذا المتصفح لا يدعم إشعارات الجهاز.</p>';
  else body='<button class="btn primary" type="button" data-act="enable-notif" style="align-self:flex-start">تفعيل إشعارات الجهاز</button>';
  return '<div class="panel"><h3>إشعارات الجهاز</h3><p>تصلك التنبيهات كإشعار على التلفون في موعد كل جرعة.</p>'+body+'</div>';
}
var deferredInstall=null;
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;if(cur==='settings')render(true);});
window.addEventListener('appinstalled',function(){deferredInstall=null;if(cur==='settings')render(true);});
function installPanel(){
  if(isStandalone())return '<div class="panel"><h3>التثبيت</h3><span class="chip ok" style="align-self:flex-start">التطبيق مثبّت على تلفونك</span></div>';
  return '<div class="panel"><h3>تثبيت على التلفون</h3>'+(deferredInstall?'<button class="btn primary" type="button" data-act="install" style="align-self:flex-start">تثبيت التطبيق</button>':'<p>اضغط ⋮ في Chrome ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</p>')+'</div>';
}
/* ---------- actions ---------- */
function copy(text,okMsg){
  function fallback(){
    try{
      var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);
      toast(ok?okMsg:'حدّد النص يدوياً وانسخه');
    }catch(e){toast('حدّد النص يدوياً وانسخه');}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(okMsg);},fallback);}
    else fallback();
  }catch(e){fallback();}
}
function setErr(scope,msg){forms.err[scope]=msg;render(true);}
function updateMedsList(){var el=document.getElementById('medsList');if(el)el.innerHTML=medsListHtml();}
var armTimer=null;
function armed(el,label,doIt){
  if(el.getAttribute('data-armed')==='1'){doIt();return;}
  var old=el.textContent;
  el.setAttribute('data-armed','1');el.textContent='اضغط للتأكيد';
  clearTimeout(armTimer);
  armTimer=setTimeout(function(){el.removeAttribute('data-armed');el.textContent=old;},3500);
}

document.addEventListener('input',function(ev){
  var f=ev.target.getAttribute&&ev.target.getAttribute('data-f');
  if(!f)return;
  setPath(f,ev.target.value);
  if(f==='ui.q')updateMedsList();
});
document.addEventListener('change',function(ev){
  var f=ev.target.getAttribute&&ev.target.getAttribute('data-f');
  if(!f)return;
  setPath(f,ev.target.value);
});
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act'), D=el.dataset;
  switch(act){
    case 'goto': toastEl.hidden=true; go(D.to); break;
    case 'back': back(); break;
    case 'set': setPath(D.f,D.n?+D.v:D.v); render(true); break;
    case 'toggle':
      var arr=getPath(D.f), v=D.n?+D.v:D.v, ix=arr.indexOf(v);
      if(ix>=0)arr.splice(ix,1);else arr.push(v);
      render(true); break;
    case 'flip': setPath(D.f,!getPath(D.f)); applySettings(); render(true); break;
    case 'ui-flip': setPath(D.f,!getPath(D.f)); render(true); break;
    case 'cfg':
      state.settings[D.k]=isNaN(+D.v)?D.v:+D.v; save(); applySettings(); render(true); break;
    case 'skip-intro': state.onboarded=true; save(); go('home'); break;
    case 'ob-next':
      if(obSlide<2){obSlide++;render(false);}else{go('profile');}
      break;
    case 'profile-next':
      if(!forms.profile.name.trim()){setErr('profile','اكتب اسمك.');break;}
      forms.err.profile=''; go('health'); break;
    case 'health-save':
      var h=forms.health, p=state.profile, conds=h.conditions.slice();
      if(h.other.trim())conds.push(h.other.trim());
      p.name=forms.profile.name.trim(); p.age=forms.profile.age.trim(); p.gender=forms.profile.gender;
      p.conditions=conds; p.allergies=h.allergies.trim(); p.blood=h.blood;
      state.onboarded=true; save(); stack=[]; go('home',{noPush:true});
      toast('أهلاً '+esc(p.name)+'، ملفك جاهز'); break;
    case 'new-med': forms.add=blankAdd(); forms.err={}; go('add1'); break;
    case 'add-next':
      if(!forms.add.name.trim()){setErr('add','اكتب اسم الدواء.');break;}
      forms.err.add=''; go('add2'); break;
    case 'add-time': if(forms.add.times.length<8){forms.add.times.push('12:00');render(true);} break;
    case 'rm-time': forms.add.times.splice(+D.i,1); render(true); break;
    case 'days-all': forms.add.days=[0,1,2,3,4,5,6]; render(true); break;
    case 'add-save':
      var a=forms.add, times=a.times.filter(Boolean).filter(function(t,i,arr){return arr.indexOf(t)===i;}).sort();
      if(!times.length){setErr('add','اختر موعداً واحداً على الأقل.');break;}
      if(!a.days.length){setErr('add','اختر يوماً واحداً على الأقل.');break;}
      var st=parseInt(String(a.stock).replace(/[^0-9]/g,''),10);
      var med={id:uid('m'),name:a.name.trim(),dose:a.dose.trim(),form:a.form,times:times,days:a.days.slice().sort(),note:a.note,start:dateKey(new Date()),end:a.duration?dateKey(addDays(new Date(),a.duration-1)):null,stock:isNaN(st)?null:st};
      state.meds.push(med); save(); forms.err={}; selMed=med.id;
      stack=[]; go('home',{noPush:true}); toast('تمت إضافة «'+esc(med.name)+'»'); break;
    case 'open-med': selMed=D.id; go('medDetail'); break;
    case 'del-med':
      armed(el,'حذف الدواء',function(){
        state.meds=state.meds.filter(function(m){return m.id!==D.id;}); save(); toast('تم حذف الدواء'); back();
        if(cur==='medDetail')go('meds',{noPush:true});
      }); break;
    case 'take': setStatus(D.key,'taken'); break;
    case 'skip': setStatus(D.key,'skipped'); break;
    case 'undo': setStatus(D.key,null); break;
    case 'snooze':
      snoozed[D.key]=Date.now()+state.settings.snooze*60000; delete notified[dateKey(new Date())+'|'+D.key];
      toast('سأذكّرك بعد '+num(state.settings.snooze)+' دقائق'); render(true); break;
    case 'cal-sel': cal.sel=D.k; render(true); break;
    case 'cal-m':
      var nm=new Date(cal.y,cal.m+(+D.d),1); cal.y=nm.getFullYear(); cal.m=nm.getMonth(); render(true); break;
    case 'stock-on': var mm=medById(D.id); if(mm){mm.stock=30;save();render(true);} break;
    case 'stock-add':
      var m2=medById(D.id); if(m2){m2.stock=Math.max(0,(m2.stock||0)+(+D.v));save();render(true);} break;
    case 'notif-read': state.notifs.forEach(function(n){n.read=true;}); save(); render(true); break;
    case 'notif-clear': state.notifs=[]; save(); render(true); break;
    case 'cg-save':
      if(!forms.cg.name.trim()){setErr('cg','اكتب اسم المرافق.');break;}
      state.caregivers.push({id:uid('c'),name:forms.cg.name.trim(),rel:forms.cg.rel,phone:forms.cg.phone.trim(),notify:!!forms.cg.notify});
      save(); forms.cg={name:'',rel:'',phone:'',notify:true}; forms.err.cg=''; forms.ui.showCg=false; render(true); break;
    case 'cg-del': state.caregivers=state.caregivers.filter(function(c){return c.id!==D.id;}); save(); render(true); break;
    case 'cg-copy':
      var c=state.caregivers.filter(function(x){return x.id===D.id;})[0]; if(c)copy(cgMessage(c),'تم نسخ الرسالة. الصقها في واتساب أو الرسائل'); break;
    case 'appt-new': forms.appt={doctor:'',date:dateKey(new Date()),time:'10:00',note:''}; forms.ui.showAppt=true; render(true); break;
    case 'appt-save':
      if(!forms.appt.date){setErr('appt','اختر تاريخ الموعد.');break;}
      state.appts.push({id:uid('a'),doctor:forms.appt.doctor,date:forms.appt.date,time:forms.appt.time||'10:00',note:forms.appt.note.trim()});
      save(); forms.err.appt=''; forms.ui.showAppt=false; render(true); break;
    case 'appt-del': state.appts=state.appts.filter(function(x){return x.id!==D.id;}); save(); render(true); break;
    case 'doc-save':
      if(!forms.doc.name.trim()){setErr('doc','اكتب اسم الطبيب.');break;}
      state.doctors.push({id:uid('d'),name:forms.doc.name.trim(),spec:forms.doc.spec.trim(),phone:forms.doc.phone.trim()});
      save(); forms.doc={name:'',spec:'',phone:''}; forms.err.doc=''; forms.ui.showDoc=false; render(true); break;
    case 'doc-del': state.doctors=state.doctors.filter(function(x){return x.id!==D.id;}); save(); render(true); break;
    case 'sym-for': forms.sym.med=D.id; go('symptoms'); break;
    case 'sym-save':
      if(!forms.sym.text.trim()){setErr('sym','اكتب ما تشعر به.');break;}
      state.symptoms.push({id:uid('s'),at:Date.now(),text:forms.sym.text.trim(),level:forms.sym.level,med:forms.sym.med});
      save(); forms.sym={text:'',level:'خفيف',med:''}; forms.err.sym=''; render(true); toast('تم حفظ العرَض'); break;
    case 'sym-del': state.symptoms=state.symptoms.filter(function(x){return x.id!==D.id;}); save(); render(true); break;
    case 'copy-report': copy(reportText(forms.ui.period),'تم نسخ التقرير'); break;
    case 'copy-em': copy(emText(),'تم نسخ بطاقة الطوارئ'); break;
    case 'blood': state.profile.blood=D.v; save(); render(true); break;
    case 'enable-notif': try{Notification.requestPermission().then(function(){render(true);});}catch(e){} break;
    case 'install': if(deferredInstall){deferredInstall.prompt();deferredInstall=null;render(true);} break;
    case 'reset':
      armed(el,'مسح',function(){
        state=fresh(); save(); notified={}; snoozed={}; stack=[]; obSlide=0; selMed=null;
        forms.profile={name:'',age:'',gender:''}; forms.health={conditions:[],other:'',allergies:'',blood:''};
        applySettings(); go('welcome',{noPush:true});
      }); break;
  }
});

/* ---------- init ---------- */
applySettings();
(function(){
  var h=(location.hash||'').slice(1);
  cur=SCREENS[h]?h:(state.onboarded?'home':'welcome');
  if(cur==='medDetail'&&!medById(selMed))cur='meds';
  if(cur==='medDetail')selMed=selMed||(state.meds[0]&&state.meds[0].id);
  render(false);
})();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');}catch(e){}
setTimeout(tick,1500);
setInterval(tick,15000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
})();
</script>
